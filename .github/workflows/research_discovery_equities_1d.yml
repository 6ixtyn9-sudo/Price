name: Research Discovery Equities 1d

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: "Research refresh run that opened the fresh-data gate"
        required: false
        default: manual
      batch_size:
        description: "Symbols per shard"
        required: false
        default: "40"
  workflow_call:
    inputs:
      parent_run_id:
        required: false
        type: string
        default: manual
      batch_size:
        required: false
        type: string
        default: "40"

concurrency:
  group: research-discovery-1d
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: src
  TIMEFRAME: "1d"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build shard plan
        id: plan
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '40' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          symbol_pattern = re.compile(r"^[A-Z0-9][A-Z0-9.\-]{0,14}(/[A-Z0-9][A-Z0-9.\-]{0,14})?$")
          if not os.path.exists("localdata/explicit_allowlist.json"):
              raise SystemExit("localdata/explicit_allowlist.json not found")
          payload = json.load(open("localdata/explicit_allowlist.json"))
          if "equities" not in payload or not isinstance(payload["equities"], list):
              raise SystemExit("explicit_allowlist.json missing '.equities' array")
          symbols = [str(s).strip().upper() for s in payload["equities"]]
          bad_scope = [s for s in symbols if "/" in s or s.startswith("FUT/")]
          if bad_scope:
              raise SystemExit("Equity discovery received non-equity symbols: " + ", ".join(bad_scope[:10]))
          invalid = [s for s in symbols if not symbol_pattern.fullmatch(s)]
          if invalid:
              raise SystemExit("Invalid symbols in explicit_allowlist.json: " + ", ".join(invalid[:10]))
          batch_size = int(os.environ["BATCH_SIZE"])
          timeframe = os.environ.get("TIMEFRAME", "1d")
          include = []
          for offset in range(0, len(symbols), batch_size):
              batch = symbols[offset:offset + batch_size]
              index = offset // batch_size
              include.append({
                  "shard_id": f"{timeframe}-{index:02d}",
                  "symbols_json": json.dumps(batch, separators=(",", ":")),
              })
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          print("shard_ids=" + json.dumps([item["shard_id"] for item in include]))
          PY

  shards:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Restore research warehouse cache
        id: warehouse
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: localdata/warehouse
          key: research-warehouse-v4-${{ runner.os }}-research-discovery-${{ github.run_id }}
          restore-keys: |
            research-warehouse-v4-${{ runner.os }}-equities-refresh-
            research-warehouse-v4-${{ runner.os }}-crypto-discovery-merged-
            research-warehouse-v4-${{ runner.os }}-futures-discovery-merged-
            research-warehouse-v4-${{ runner.os }}-research-discovery-
            research-warehouse-v4-${{ runner.os }}-crypto-refresh-
            research-warehouse-v4-${{ runner.os }}-futures-refresh-
            research-warehouse-v4-${{ runner.os }}-crypto-discovery-
            research-warehouse-v4-${{ runner.os }}-futures-discovery-
            research-warehouse-v4-${{ runner.os }}-
      - name: Refuse cross-lane warehouse cache
        if: steps.warehouse.outputs.cache-matched-key != ''
        run: |
          case "${{ steps.warehouse.outputs.cache-matched-key }}" in
            *live-capture*)
              echo "::error::research restored live-lane warehouse cache '${{ steps.warehouse.outputs.cache-matched-key }}' — shallow lineage silently starves discovery (see HANDOVER 2026-08-08); refusing to run blind"
              exit 1 ;;
          esac
          echo "warehouse cache lineage ok: ${{ steps.warehouse.outputs.cache-matched-key }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Run isolated shard
        env:
          SHARD_SYMBOLS_JSON: ${{ matrix.symbols_json }}
        run: |
          python scripts/research_shard.py \
            --shard-id "${{ matrix.shard_id }}" \
            --timeframe "${TIMEFRAME}" \
            --symbols-json "$SHARD_SYMBOLS_JSON" \
            --output-dir "localdata/research/shards/${{ matrix.shard_id }}" \
            --condition-on USO TLT \
            --bin-mode rolling
      - name: Upload shard output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-shard-${{ matrix.shard_id }}
          path: localdata/research/shards/${{ matrix.shard_id }}
          if-no-files-found: error
          retention-days: 14

  merge:
    needs: [plan, shards]
    if: ${{ always() && needs.shards.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Download all completed shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: research-shard-1d-*
          path: localdata/research/shards
          merge-multiple: false
      - name: Write expected shard manifest
        env:
          SHARD_IDS: ${{ needs.plan.outputs.shard_ids }}
        run: |
          mkdir -p localdata/research/merged/1d
          echo '{"shard_ids":'"$SHARD_IDS"'}' > localdata/research/merged/1d/expected_shards.json
      - name: Merge complete shard set
        run: |
          python scripts/research_merge.py \
            --shard-root localdata/research/shards \
            --expected-shards localdata/research/merged/1d/expected_shards.json \
            --output-dir localdata/research/merged/1d \
            --promote-proposals \
            --apply-monitored-slices \
            --allow-partial
      - name: Sync rolling monitored book and execution edge metrics
        if: ${{ needs.shards.result == 'success' }}
        env:
          DISCOVERY_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/sync_monitored.py
      - name: Run regime diagnostics on merged top 25
        run: |
          python scripts/validate_slices.py \
            --slices-path localdata/research/merged/1d/candidate_leaderboard_merged.csv \
            --regime-stratified-diagnostics \
            --regime-stratified-output localdata/research/merged/1d/regime_stratified_diagnostics_merged.csv \
            --diagnostic-scope leaderboard-top \
            --top-n 25 \
            --bin-mode rolling
      - name: Run date-range diagnostics on merged top 25
        run: |
          python scripts/validate_slices.py \
            --slices-path localdata/research/merged/1d/candidate_leaderboard_merged.csv \
            --date-range-diagnostics \
            --date-range-diagnostics-output localdata/research/merged/1d/date_range_diagnostics_merged.csv \
            --diagnostic-scope leaderboard-top \
            --top-n 25 \
            --bin-mode rolling
      - name: Commit merged research outputs and monitored book
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          # The book is derived state shared by 1d/1h/15m, so it is rebuilt on
          # rejection instead of text-merged. See scripts/commit_research_book.sh.
          if [ "$SHARDS_RESULT" = "success" ]; then
            scripts/commit_research_book.sh 1d --sync-book
          else
            scripts/commit_research_book.sh 1d
          fi
